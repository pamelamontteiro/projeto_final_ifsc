<!DOCTYPE html>
<html>

<head>
    <title>Venha para Santa Catarina</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">

    <script>
        function isLoggedIn () {
            const token = localStorage.get('token')
            console.log(token);
            if (!token) {return false}
            else {
                alert("Funcionou")
            }
        }

        function login_usuario() {
            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;
            let _data = {
                email: email, 
                senha: senha
            }

            fetch('http://localhost:8000/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(_data)
            })
            .then(response => {
                if(response.ok ==true) {
                    return response.json();
                }
                else {
                    console.log("Erro no login");
                }
            })
            .then(json => {
                localStorage.setItem('token', json.id)
                window.location.replace("index.html");
            });
        }

        isLoggedIn();
    </script>
</head>

<body>
    <div id="cabecalho">
        <div id="menu">
            <button class="dropdown-btn"><img class="botao-grande" src="img/menu.png" alt="Menu" /></button>
            <ul class="dropdown-content">
                <li><a href="index.html">Página principal</a></li>
                <li><a href="destino.html">Destinos</a></li>
                <li><a href="quem_somos.html">Quem somos</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </div>
        <div id="logo">Venha para Santa Cantarina</div>
        <div id="midias">
            <div id="cadastro" class="botao-midias"><a href="login.html"><img class="botao-pequeno"
                        src="img/person.png" /></a></div>
            <div id="instagram" class="botao-midias"><a href="http://www.instagram.com" target="_blank"><img
                        class="botao-pequeno" src="img/instagram.png" /></a></div>
            <div id="twitter" class="botao-midias"><a href="http://www.twitter.com" target="_blank"><img
                        class="botao-pequeno" src="img/twitter.png" /></a></div>
        </div>
    </div>
    <div id="conteudo">
        <div id="caixa-contato">
            <div id="titulo-conteudo">
                <a href="index.html">Voltar</a>
                <h1>Cadastrar</h1>
                <a href="index.html">X</a>
            </div>
            <div id="texto-conteudo">
                <div>
                    <form id="formulario-cadastro" onsubmit="return false">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>

                        <button onClick="login_usuario()">Entrar</button>
                    </form>
                </div>
                <div>
                    <a href="cadastro.html">Caso não tenha conta, se cadastre aqui!</a>
                </div>
            </div>
            <div id="contato-rodape">
                <p>Email: contato@venhaparasantacatarina.com</p>
                <p>Telefone: (48) 99999-9999</p>
                <div id="sociais">
                    <a href="http://www.twitter.com" target="_blank"><img class="botao-midias"
                            src="img/twitter_preto.png" /></a>
                    <a href="http://www.instagram.com" target="_blank"><img class="botao-midias"
                            src="img/instagram_preto.png" /></a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
